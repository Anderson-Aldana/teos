<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/logo.png" />
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Meta tags para PWA -->
    <meta name="theme-color" content="#3498db">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icon-192x192.png">

    <!-- Service Worker Registration -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then(registration => console.log('SW registrado:', registration))
            .catch(error => console.log('Error al registrar SW:', error));
        });
    }
    </script>
</head>
<body>
    <div class="menu-container">
        <button id="menu-btn" class="menu-btn">☰</button>
        <div class="menu-dropdown" id="menu-dropdown">
            <div class="theme-switch">
                <span>Modo Oscuro</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Calculadora de Notas</h1>
        
        <form id="form-notas">
            <div class="input-group">
                <label for="num-secciones">Número de Secciones:</label>
                <input type="number" id="num-secciones" min="1" max="5" required>
            </div>

            <div id="secciones-container" class="secciones-container"></div>

            <div class="input-group">
                <label for="nota-minima">Nota mínima para aprobar:</label>
                <input type="number" id="nota-minima" min="0" max="20" step="0.01" required>
            </div>

            <div class="input-group">
                <label for="nota-objetivo">Nota objetivo:</label>
                <select id="nota-objetivo" required>
                    <option value="minima">Mínima para aprobar</option>
                    <option value="12">12 (Suficiente)</option>
                    <option value="13">13 (Bueno)</option>
                    <option value="14">14 (Notable)</option>
                    <option value="15">15 (Excelente)</option>
                    <option value="16">16 (Sobresaliente)</option>
                    <option value="17">17 (Muy sobresaliente)</option>
                    <option value="18">18 (Excelente superior)</option>
                    <option value="19">19 (Excepcional)</option>
                    <option value="20">20 (Perfecto)</option>
                </select>
            </div>

            <div class="input-group"> 
                <label for="nota-entera">Usar notas enteras:</label> 
                <input type="checkbox" id="nota-entera"> 
            </div>

            <button type="submit" class="btn-submit">Calcular</button>
        </form>

        <div id="resultados" class="resultados"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
